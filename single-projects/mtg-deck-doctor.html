<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="keywords"
      content="TypeScript, Next.js, Tailwind, Supabase, Scryfall, MTG, Commander, Magic The Gathering, Netlify, PWA"
    />
    <meta
      name="description"
      content="MTG Deck Doctor — Next.js app for diagnosing Commander decks with health scores, cut/add suggestions, and shared card tracking."
    />
    <meta name="author" content="Antonio Sertić" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Deck Doctor — Portfolio</title>
    <link rel="stylesheet" href="../reset.css" />
    <link rel="stylesheet" href="../css/global-style.css" />
    <link rel="stylesheet" href="../css/single-project-style.css" />
    <link
      rel="stylesheet"
      href="../assets/swiper-11.0.7/swiper-bundle.min.css"
    />
    <script defer src="../assets/swiper-11.0.7/swiper-bundle.min.js"></script>
    <script defer src="../assets/jquery-3.6.4.min.js"></script>
    <script defer src="../navbar.js"></script>
    <script defer src="../script.js"></script>
    <script defer src="../sidebar.js"></script>
    <script defer src="../single-project-script.js"></script>
  </head>
  <body>
    <nav id="navbar">
      <ul>
        <li>
          <a href="/#aboutme-section" data-localization-key="menu-about-me"></a>
        </li>
        <li>
          <a href="/#jobs-section" data-localization-key="menu-experience"></a>
        </li>
        <li>
          <a
            href="/#projects-section"
            data-localization-key="menu-projects"
          ></a>
        </li>
        <li>
          <a href="/#contact-section" data-localization-key="menu-contact"></a>
        </li>
        <li>
          <select class="palette-select action-button-link" placeholder="Theme">
            <option value="theme-1" data-localization-key="theme-1"></option>
            <option value="theme-2" data-localization-key="theme-2"></option>
            <option value="theme-3" data-localization-key="theme-3"></option>
          </select>
        </li>
        <li>
          <select
            class="language-select action-button-link"
            placeholder="Language"
            id="change-language"
          >
            <option value="en">English</option>
            <option value="hr">Croatian</option>
          </select>
        </li>
      </ul>
      <div id="toggleBtn">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>

    <aside class="sidebar">
      <ul>
        <li>
          <a href="/#aboutme-section" data-localization-key="menu-about-me"></a>
        </li>
        <li>
          <a href="/#jobs-section" data-localization-key="menu-experience"></a>
        </li>
        <li>
          <a
            href="/#projects-section"
            data-localization-key="menu-projects"
          ></a>
        </li>
        <li>
          <a href="/#contact-section" data-localization-key="menu-contact"></a>
        </li>
        <li>
          <select class="palette-select action-button-link" placeholder="Theme">
            <option value="theme-1" data-localization-key="theme-1"></option>
            <option value="theme-2" data-localization-key="theme-2"></option>
            <option value="theme-3" data-localization-key="theme-3"></option>
          </select>
        </li>
        <li>
          <select
            class="language-select action-button-link"
            placeholder="Language"
            id="change-language-sidebar"
          >
            <option value="en">English</option>
            <option value="hr">Croatian</option>
          </select>
        </li>
      </ul>
    </aside>

    <div class="container">
      <section class="single-project-section">
        <p class="heading">MTG Deck Doctor</p>

        <div
          class="project-description"
          data-localization-key="single-project-mtg-deck-doctor"
        ></div>

        <div class="links">
          <a
            href="https://github.com/AntonioSertic23/MTGDeckDoctor"
            target="_blank"
            class="action-button-link"
            >GitHub</a
          >
          <a
            href="https://mtgdeckdoctor.netlify.app"
            target="_blank"
            class="action-button-link"
            >Live</a
          >
        </div>

        <div class="slider-container slider-precise">
          <div class="swiper">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <img
                  src="../assets/projects/mtg-deck-doctor/1.png"
                  width="1920"
                  height="920"
                  loading="eager"
                  decoding="async"
                  alt="MTG Deck Doctor — home overview"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="../assets/projects/mtg-deck-doctor/2.png"
                  width="1920"
                  height="920"
                  loading="lazy"
                  decoding="async"
                  alt="MTG Deck Doctor — decks library"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="../assets/projects/mtg-deck-doctor/3.png"
                  width="1920"
                  height="920"
                  loading="lazy"
                  decoding="async"
                  alt="MTG Deck Doctor — deck diagnosis header and commander"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="../assets/projects/mtg-deck-doctor/4.png"
                  width="1920"
                  height="920"
                  loading="lazy"
                  decoding="async"
                  alt="MTG Deck Doctor — health metrics"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="../assets/projects/mtg-deck-doctor/5.png"
                  width="1920"
                  height="920"
                  loading="lazy"
                  decoding="async"
                  alt="MTG Deck Doctor — problems and suggestions"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="../assets/projects/mtg-deck-doctor/6.png"
                  width="1920"
                  height="920"
                  loading="lazy"
                  decoding="async"
                  alt="MTG Deck Doctor — import decklist"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="../assets/projects/mtg-deck-doctor/7.png"
                  width="1920"
                  height="920"
                  loading="lazy"
                  decoding="async"
                  alt="MTG Deck Doctor — shared cards"
                />
              </div>
            </div>
          </div>

          <div class="swiper-pagination"></div>

          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
        </div>
      </section>
    </div>

    <footer>
      <p data-localization-key="footer"></p>
    </footer>
  </body>
</html>
